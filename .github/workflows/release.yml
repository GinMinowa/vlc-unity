# Run all four architectures at the exact same tag/commit before publishing.
# A failed platform blocks publication; manually dispatching this workflow builds
# all platforms but never creates a Release without a unity-v* Git tag.
name: Release VLC Unity

on:
  push:
    tags:
      - 'unity-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read
  macos:
    uses: ./.github/workflows/build-macos.yml
    permissions:
      contents: read
  ios:
    uses: ./.github/workflows/build-ios.yml
    permissions:
      contents: read
  android:
    uses: ./.github/workflows/build-android.yml
    permissions:
      contents: read

  publish:
    name: Publish validated release ZIPs
    if: startsWith(github.ref, 'refs/tags/unity-v')
    needs: [windows, macos, ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all four complete platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: VLCUnity-*
          path: release-assets
          merge-multiple: true

      - name: Verify all four ZIP files
        run: |
          set -euo pipefail
          cd release-assets
          for name in VLCUnity-Windows-x86_64 VLCUnity-macOS-ARM64 VLCUnity-iOS-ARM64 VLCUnity-Android-arm64-v8a; do
            test -s "${name}.zip" || { echo "Missing ${name}.zip" >&2; exit 1; }
            unzip -t "${name}.zip" | tail -n1
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.zip --repo "$REPO" --clobber
          else
            gh release create "$TAG" release-assets/*.zip --repo "$REPO" --verify-tag --generate-notes
          fi
