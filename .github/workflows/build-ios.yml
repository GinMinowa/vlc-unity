# Build LibVLC (iphoneos/aarch64) + VLCUnityPlugin for iOS.
# Ported from VideoLAN vlc-unity .gitlab-ci.yml
# (libvlc-ios-arm64 + unity-plugin-ios-aarch64).
# NON-watermark only: never passes -Dwatermark=true / ARGS_TRIAL.
#
# Single job on macos-15: build LibVLC then meson/copy_ios immediately
# (avoids download-artifact layout mismatches).

name: Build iOS (aarch64)

on:
  workflow_dispatch:
    inputs:
      experimental_vp9_videotoolbox:
        description: 'Experimental VP9 hardware decode (supported devices on iOS 26.2+)'
        required: false
        type: boolean
        default: false
      filter_plugins:
        description: 'Experimental codec whitelist (reduces feature coverage)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      experimental_vp9_videotoolbox:
        required: false
        type: boolean
        default: false
      filter_plugins:
        required: false
        type: boolean
        default: false
  push:
    paths:
      - "PluginSource/**"
      - "build-libvlc.sh"
      - "scripts/**"
      - "Assets/VLCUnity/**"
      - "tests/**"
      - "copy_ios.sh"
      - "cross/iphoneos.txt"
      - "patches/ios-vp9-videotoolbox.patch"
      - "patches/ios-vp9-session-log.patch"
      - "patches/apple-libtool-objc-tags.patch"
      - "patches/fix-apple-libtool-tags.py"
      - "patches/test-fix-apple-libtool-tags.py"
      - "meson.build"
      - "meson_options.txt"
      - "Info.plist.template.sh"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "PluginSource/**"
      - "build-libvlc.sh"
      - "scripts/**"
      - "Assets/VLCUnity/**"
      - "tests/**"
      - "copy_ios.sh"
      - "cross/iphoneos.txt"
      - "patches/ios-vp9-videotoolbox.patch"
      - "patches/ios-vp9-session-log.patch"
      - "patches/apple-libtool-objc-tags.patch"
      - "patches/fix-apple-libtool-tags.py"
      - "patches/test-fix-apple-libtool-tags.py"
      - "meson.build"
      - "meson_options.txt"
      - "Info.plist.template.sh"
      - ".github/workflows/build-ios.yml"

concurrency:
  group: build-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Production pin: vlc-unity tag 2026-3 (PluginSource old APIs) + LibVLC e7a30c9d47
  # (trial v9 / 2026-3 engine, 2026-06-17). NOT floating master; NOT ancient git tag 4.0.0-dev.
  VLC_GIT_REF: e7a30c9d47e8328de37cf1760a815e0af673fe12
  ARCH: aarch64
  SDKNAME: iphoneos
  SHORT_ARCH: arm64
  # VLCKit patches compatible with the pinned VLC live555 2022.07.14 tree.
  # Newer VLCKit patches target a newer VLC and cannot be applied here.
  # Keep both LGPLv2-compatible live555 patches, rather than skipping conflicts.
  VLCKIT_PATCH_REF: b671b9f8b78c9a8c64d39a13396622c705c5dddc

jobs:
  # ---------------------------------------------------------------------------
  # Combined: libvlc-ios-arm64 + unity-plugin-ios-aarch64 (no artifact hop)
  # ---------------------------------------------------------------------------
  build-ios:
    name: libvlc+plugin-ios-arm64
    runs-on: macos-15
    steps:
      - name: Checkout vlc-unity
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select an installed SDK that exposes iOS VP9 decoder registration
        if: inputs.experimental_vp9_videotoolbox
        run: |
          set -euo pipefail
          # Do not silently compile away the iOS 26.2 registration API.
          python3 - <<'PYTHON'
          import glob, os, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              env = dict(os.environ, DEVELOPER_DIR=developer)
              try:
                  version = subprocess.check_output(
                      ['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], env=env, text=True).strip()
                  parts = tuple(map(int, version.split('.')))
                  if parts >= (26, 2): candidates.append((parts, developer))
              except (ValueError, subprocess.CalledProcessError): pass
          if not candidates:
              raise SystemExit('Experimental VP9 requires an installed iOS 26.2+ SDK; no fallback to older SDK')
          developer = max(candidates)[1]
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('DEVELOPER_DIR=' + developer + '\n')
          print('Selected', developer)
          PYTHON

      - name: Show Xcode / SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          sysctl -n hw.ncpu

      - name: Install build tools (Homebrew — trusted)
        run: |
          set -euo pipefail
          brew update
          brew install meson ninja pkg-config nasm automake autoconf libtool gettext
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Clone VLC (VideoLAN primary, GitHub fallback)
        run: |
          set -euo pipefail
          REF="${VLC_GIT_REF}"
          clone_ref() {
            local url="$1"
            rm -rf vlc
            git init vlc
            git -C vlc remote add origin "$url"
            git -C vlc fetch --depth=1 origin "$REF"
            git -C vlc checkout --force FETCH_HEAD
          }
          if clone_ref https://code.videolan.org/videolan/vlc.git; then
            echo "Cloned VLC from code.videolan.org"
          else
            echo "Primary failed; GitHub mirror"
            clone_ref https://github.com/videolan/vlc.git
          fi
          echo "Building LibVLC from ${REF}"
          git -C vlc rev-parse HEAD
          git -C vlc describe --tags --always || true

      - name: Prefer ftp.gnu.org for VLC extras/tools (ftpmirror 502s)
        run: |
          set -euo pipefail
          # Trial/master tip pins GNU=https://ftpmirror.gnu.org/gnu which 502s for m4-1.4.21.
          # VideoLAN contrib mirror lacks m4-1.4.21 (404). Official ftp.gnu.org works.
          sed -i.bak -e 's|^GNU=https://ftpmirror.gnu.org/gnu|GNU=https://ftp.gnu.org/gnu|' \
            -e 's|^GNU=http://ftpmirror.gnu.org/gnu|GNU=https://ftp.gnu.org/gnu|' \
            vlc/extras/tools/packages.mak
          grep -n '^GNU=' vlc/extras/tools/packages.mak

      - name: Apply version-pinned VLCKit live555 patches (fail on conflicts)
        working-directory: vlc
        run: |
          set -euo pipefail
          for patch in \
            0001-Revert-contrib-live555-update-to-2022.07.14.patch \
            0002-contrib-use-live555-version-that-is-compatible-with-.patch; do
            url="https://raw.githubusercontent.com/videolan/vlckit/${VLCKIT_PATCH_REF}/libvlc/patches/${patch}"
            curl --fail --location --retry 3 --output "$patch" "$url"
            test -s "$patch"
            if git apply --check "$patch"; then
              git apply "$patch"
              echo "Applied ${patch}"
            elif git apply --reverse --check "$patch"; then
              echo "Already applied: ${patch}"
            else
              echo "ERROR: ${patch} is incompatible with pinned VLC ${VLC_GIT_REF}" >&2
              exit 1
            fi
          done

      - name: Backport upstream VP9 VideoToolbox support (experimental)
        if: inputs.experimental_vp9_videotoolbox
        run: |
          set -euo pipefail
          git -C vlc apply --check ../patches/ios-vp9-videotoolbox.patch
          git -C vlc apply ../patches/ios-vp9-videotoolbox.patch
          git -C vlc apply --check ../patches/ios-vp9-session-log.patch
          git -C vlc apply ../patches/ios-vp9-session-log.patch
          python3 tests/VP9/session-log.py vlc/modules/codec/videotoolbox/decoder.c
          cc -std=gnu11 -Ivlc/include -Ivlc tests/VP9/parser.c \
            vlc/modules/packetizer/vp9_frame.c -o /tmp/vp9-parser-test
          /tmp/vp9-parser-test

      - name: Prepare explicit C/C++ libtool tags for Objective-C
        run: |
          set -euo pipefail
          # Bundled Libtool 2.5.4 has no Objective-C tags. After configure,
          # keep the Objective-C compilers/flags but select existing CC/CXX
          # tags explicitly for every generated compile and link command.
          git -C vlc apply --check ../patches/apple-libtool-objc-tags.patch
          git -C vlc apply ../patches/apple-libtool-objc-tags.patch

      - name: Build LibVLC for iPhoneOS aarch64
        run: |
          set -euo pipefail
          cd vlc
          mkdir -p build && cd build
          JOBS="$(sysctl -n hw.ncpu)"
          # GitLab uses -j8; GHA uses all cores. --enable-shared matches CI.
          ../extras/package/apple/build.sh \
            --sdk="${SDKNAME}" \
            --arch="${ARCH}" \
            -j"${JOBS}" \
            --enable-shared

      - name: Ensure LibVLC install path
        id: libvlc
        run: |
          set -euo pipefail
          EXPECTED="vlc/build/vlc-${SDKNAME}-${SHORT_ARCH}"
          if [[ -f "${EXPECTED}/lib/pkgconfig/libvlc.pc" ]]; then
            echo "Using ${EXPECTED}"
          else
            PC="$(find vlc/build -name "libvlc.pc" -type f 2>/dev/null | head -n1 || true)"
            if [[ -z "${PC}" ]]; then
              echo "Could not find libvlc.pc under vlc/build"
              find vlc/build -maxdepth 6 \( -type d -o -name "*.pc" \) -print 2>/dev/null | head -n 120 || true
              exit 1
            fi
            FOUND_ROOT="$(dirname "$(dirname "$(dirname "${PC}")")")"
            mkdir -p "$(dirname "${EXPECTED}")"
            if [[ "${FOUND_ROOT}" != "${EXPECTED}" ]]; then
              rm -rf "${EXPECTED}"
              mv "${FOUND_ROOT}" "${EXPECTED}"
              echo "Relocated ${FOUND_ROOT} -> ${EXPECTED}"
            fi
          fi
          if [[ ! -f "${EXPECTED}/lib/pkgconfig/libvlc.pc" ]]; then
            echo "Missing ${EXPECTED}/lib/pkgconfig/libvlc.pc after restore"
            find "${EXPECTED}" -maxdepth 4 -print 2>/dev/null | head -n 80 || true
            exit 1
          fi
          echo "vlc_root=${EXPECTED}" >> "$GITHUB_OUTPUT"

      - name: Filter LibVLC plugins (optional, codecs only)
        if: ${{ inputs.filter_plugins }}
        run: |
          set -euo pipefail
          PLUGINS="vlc/build/vlc-${SDKNAME}-${SHORT_ARCH}/lib/vlc/plugins"
          if [[ ! -d "${PLUGINS}" ]]; then
            echo "Plugins dir not at ${PLUGINS}; searching…"
            PLUGINS="$(find "vlc/build/vlc-${SDKNAME}-${SHORT_ARCH}" -type d -path '*/vlc/plugins' | head -n1 || true)"
          fi
          if [[ -z "${PLUGINS}" || ! -d "${PLUGINS}" ]]; then
            echo "ERROR: could not locate VLC plugins under vlc/build/vlc-${SDKNAME}-${SHORT_ARCH}"
            find "vlc/build" -maxdepth 8 -type d -name plugins -print | head -n 40 || true
            exit 1
          fi
          chmod +x scripts/filter-vlc-plugins.sh
          ./scripts/filter-vlc-plugins.sh "${PLUGINS}"
          echo "NOTE: plugins.dat removed by filter; filtered tree is uploaded and what copy_ios.sh will package."
      - name: Upload LibVLC iOS artifacts (whole tree)
        uses: actions/upload-artifact@v6
        with:
          name: libvlc-ios-arm64${{ inputs.experimental_vp9_videotoolbox && '-experimental-vp9' || '' }}
          path: vlc/build/vlc-${{ env.SDKNAME }}-${{ env.SHORT_ARCH }}
          retention-days: 90
          if-no-files-found: error

      - name: Patch libvlc.pc + Meson/Ninja build (NO watermark)
        run: |
          set -euo pipefail
          VLC_ROOT="${{ steps.libvlc.outputs.vlc_root }}"
          cd "${VLC_ROOT}"
          PREFIX_ESC="$(pwd | sed 's#/#\\/#g')"
          sed -i '' "1s|.*|prefix=${PREFIX_ESC}|" lib/pkgconfig/libvlc.pc
          cat lib/pkgconfig/libvlc.pc
          cd "${GITHUB_WORKSPACE}"

          # Intentionally omit ARGS_TRIAL / -Dwatermark=true
          export PKG_CONFIG_PATH="$(pwd)/${VLC_ROOT}/lib/pkgconfig"
          meson setup --cross-file="cross/${SDKNAME}.txt" "build_${SHORT_ARCH}" -Dwatermark=false --buildtype release
          ninja -C "build_${SHORT_ARCH}"

      - name: Copy iOS plugin into Assets (copy_ios.sh)
        run: |
          set -euo pipefail
          chmod +x ./copy_ios.sh
          ./copy_ios.sh "${{ steps.libvlc.outputs.vlc_root }}" "${SHORT_ARCH}"
          # Consume all find output: head can close the pipe early and make
          # a successful copy fail under pipefail (SIGPIPE on large trees).
          find Assets/VLCUnity/Plugins/iOS -type f | sed -n '1,50p'

      - name: Upload iOS plugin tree
        uses: actions/upload-artifact@v6
        with:
          name: VLCUnityPlugin-ios-arm64${{ inputs.experimental_vp9_videotoolbox && '-experimental-vp9' || '' }}
          path: Assets/VLCUnity/Plugins/iOS
          retention-days: 90
          if-no-files-found: error

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.102'

      - name: Build LibVLCSharp for Unity iOS
        run: bash scripts/build-libvlcsharp.sh ios

      - name: Package complete Unity iOS ARM64 ZIP
        run: bash scripts/package-platform.sh ios

      - name: Label experimental package
        if: inputs.experimental_vp9_videotoolbox
        run: |
          cp docs/ios-vp9-experimental.md EXPERIMENTAL-VP9.md
          zip -j dist/VLCUnity-iOS-ARM64.zip EXPERIMENTAL-VP9.md
          mv dist/VLCUnity-iOS-ARM64.zip dist/VLCUnity-iOS-ARM64-experimental-vp9.zip

      - name: Upload complete Unity iOS ARM64 ZIP
        uses: actions/upload-artifact@v6
        with:
          name: VLCUnity-iOS-ARM64${{ inputs.experimental_vp9_videotoolbox && '-experimental-vp9' || '' }}
          path: dist/VLCUnity-iOS-ARM64${{ inputs.experimental_vp9_videotoolbox && '-experimental-vp9' || '' }}.zip
          retention-days: 90
          if-no-files-found: error
