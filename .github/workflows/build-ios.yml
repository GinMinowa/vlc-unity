# Build LibVLC (iphoneos/aarch64) + VLCUnityPlugin for iOS.
# Ported from VideoLAN vlc-unity .gitlab-ci.yml
# (libvlc-ios-arm64 + unity-plugin-ios-aarch64).
# NON-watermark only: never passes -Dwatermark=true / ARGS_TRIAL.
#
# Runner: macos-14 (Xcode preinstalled). Live555 patches from VideoLAN VLCKit.

name: Build iOS (aarch64)

on:
  workflow_dispatch:
  push:
    paths:
      - "PluginSource/**"
      - "build-libvlc.sh"
      - "copy_ios.sh"
      - "cross/iphoneos.txt"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "PluginSource/**"
      - "build-libvlc.sh"
      - "copy_ios.sh"
      - "cross/iphoneos.txt"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/build-ios.yml"

concurrency:
  group: build-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: aarch64
  SDKNAME: iphoneos
  SHORT_ARCH: arm64

jobs:
  # ---------------------------------------------------------------------------
  # Stage: build-libvlc (GitLab: libvlc-ios-arm64)
  # ---------------------------------------------------------------------------
  build-libvlc:
    name: libvlc-ios-arm64
    runs-on: macos-14
    steps:
      - name: Checkout vlc-unity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Show Xcode / SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          sysctl -n hw.ncpu

      - name: Install build tools (Homebrew — trusted)
        run: |
          set -euo pipefail
          brew update
          brew install meson ninja pkg-config nasm automake autoconf libtool gettext
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Clone VLC (VideoLAN primary, GitHub fallback)
        run: |
          set -euo pipefail
          if git clone --depth=1 https://code.videolan.org/videolan/vlc.git vlc; then
            echo "Cloned VLC from code.videolan.org"
          else
            echo "Primary VLC clone failed; falling back to GitHub mirror"
            git clone --depth=1 https://github.com/videolan/vlc.git vlc
          fi

      - name: Apply live555 patches from VideoLAN VLCKit
        working-directory: vlc
        run: |
          set -euo pipefail
          # Same URLs as .gitlab-ci.yml (.libvlc-ios-common)
          curl -fsSLO https://code.videolan.org/videolan/VLCKit/-/raw/master/libvlc/patches/0001-Revert-contrib-live555-update-to-2022.07.14.patch
          curl -fsSLO https://code.videolan.org/videolan/VLCKit/-/raw/master/libvlc/patches/0002-contrib-use-live555-version-that-is-compatible-with-.patch
          git apply 0001-Revert-contrib-live555-update-to-2022.07.14.patch \
            || { echo "Failed to apply 0001 patch"; exit 1; }
          git apply 0002-contrib-use-live555-version-that-is-compatible-with-.patch \
            || { echo "Failed to apply 0002 patch"; exit 1; }

      - name: Build LibVLC for iPhoneOS aarch64
        run: |
          set -euo pipefail
          cd vlc
          mkdir -p build && cd build
          JOBS="$(sysctl -n hw.ncpu)"
          # GitLab uses -j8; GHA uses all cores. --enable-shared matches CI.
          ../extras/package/apple/build.sh \
            --sdk="${SDKNAME}" \
            --arch="${ARCH}" \
            -j"${JOBS}" \
            --enable-shared

      - name: Upload LibVLC iOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libvlc-ios-arm64
          path: |
            vlc/build/vlc-${{ env.SDKNAME }}-${{ env.SHORT_ARCH }}/lib/
            vlc/build/vlc-${{ env.SDKNAME }}-${{ env.SHORT_ARCH }}/include/
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Stage: build-unity-plugin (GitLab: unity-plugin-ios-aarch64)
  # ---------------------------------------------------------------------------
  build-unity-plugin:
    name: unity-plugin-ios-aarch64
    needs: build-libvlc
    runs-on: macos-14
    steps:
      - name: Checkout vlc-unity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install meson/ninja (Homebrew)
        run: |
          set -euo pipefail
          brew install meson ninja pkg-config
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Download LibVLC artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: libvlc-ios-arm64
          path: .

      - name: Restore expected LibVLC path
        id: libvlc
        run: |
          set -euo pipefail
          EXPECTED="vlc/build/vlc-${SDKNAME}-${SHORT_ARCH}"
          if [[ -d "${EXPECTED}/lib/pkgconfig" ]]; then
            echo "Using ${EXPECTED}"
          else
            # Artifact download may flatten; find pkgconfig and relocate
            PC_DIR="$(find . -type d -path '*/lib/pkgconfig' | head -n1)"
            if [[ -z "${PC_DIR}" ]]; then
              echo "Could not find LibVLC pkgconfig"
              find . -maxdepth 6 -type d -print | head -n 100
              exit 1
            fi
            FOUND_ROOT="$(dirname "$(dirname "${PC_DIR}")")"
            mkdir -p "$(dirname "${EXPECTED}")"
            rm -rf "${EXPECTED}"
            mv "${FOUND_ROOT}" "${EXPECTED}"
            echo "Relocated ${FOUND_ROOT} -> ${EXPECTED}"
          fi
          echo "vlc_root=${EXPECTED}" >> "$GITHUB_OUTPUT"

      - name: Patch libvlc.pc + Meson/Ninja build (NO watermark)
        run: |
          set -euo pipefail
          VLC_ROOT="${{ steps.libvlc.outputs.vlc_root }}"
          cd "${VLC_ROOT}"
          PREFIX_ESC="$(pwd | sed 's#/#\\/#g')"
          sed -i '' "1s|.*|prefix=${PREFIX_ESC}|" lib/pkgconfig/libvlc.pc
          cat lib/pkgconfig/libvlc.pc
          cd "${GITHUB_WORKSPACE}"

          # Intentionally omit ARGS_TRIAL / -Dwatermark=true
          export PKG_CONFIG_PATH="$(pwd)/${VLC_ROOT}/lib/pkgconfig"
          meson setup --cross-file="cross/${SDKNAME}.txt" "build_${SHORT_ARCH}" --buildtype release
          ninja -C "build_${SHORT_ARCH}"

      - name: Copy iOS plugin into Assets (copy_ios.sh)
        run: |
          set -euo pipefail
          chmod +x ./copy_ios.sh
          ./copy_ios.sh "vlc/build/vlc-${SDKNAME}-${SHORT_ARCH}" "${SHORT_ARCH}"
          find Assets/VLCUnity/Plugins/iOS -type f | head -n 50

      - name: Upload iOS plugin tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VLCUnityPlugin-ios-arm64
          path: Assets/VLCUnity/Plugins/iOS
          retention-days: 14
          if-no-files-found: error
